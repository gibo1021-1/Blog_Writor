<title>블로그 원고 자동완성</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 원고 편집실 — 왼쪽은 원고 의뢰서(입력), 오른쪽은 교정지(완성 원고 + 이미지 자리 + SEO 체크) */
:root{
  --bg:#EEF1EE; --paper:#FFFFFF; --ink:#1B2220; --muted:#5C6662; --line:#D6DCD8;
  --accent:#1E6A51; --accent-ink:#FFFFFF; --accent-soft:#E2F0EA;
  --hl:#FFE36A; --hl-ink:#1B2220;
  --good:#1E7A45; --warn:#A8620B; --warn-soft:#FFF3DF; --good-soft:#E3F4EA;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
header h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit}
header p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}

.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}

/* 의뢰서 */
form{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:880px){form{position:static}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-size:13px;font-weight:700;letter-spacing:.02em}
.hint{font-size:12px;color:var(--muted);font-weight:400}
input[type=text],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.count{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--ink);color:var(--paper);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
details{border-top:1px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-size:13px;font-weight:700}
details .field{margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:12px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{font-size:13px;padding:8px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 auto}
.ai-box{background:var(--accent-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.ai-box p{margin:0}

/* 교정지 */
.out{display:flex;flex-direction:column;gap:14px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .spacer{flex:1}
.status{font-size:13px;color:var(--muted)}
.checks{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.checks h2{font-size:13px;margin:0;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

article{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,40px);min-width:0}
article:focus{outline:2px solid var(--accent);outline-offset:2px}
.post-title{font-family:var(--f-body);font-weight:800;font-size:clamp(21px,3vw,27px);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.post-meta{font-size:12px;color:var(--muted);margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.post-body{max-width:66ch;font-size:16px;line-height:1.85}
.post-body p{margin:0 0 14px}
.post-body h2{font-size:19px;font-weight:800;margin:32px 0 12px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4;text-wrap:balance}
.post-body h3{font-size:16.5px;font-weight:700;margin:20px 0 8px}
.post-body ul{margin:0 0 14px;padding-left:22px}
.post-body li{margin-bottom:4px}
mark.kw{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 1px}
.hide-hl mark.kw{background:none}
.imgslot{margin:22px 0;border:2px dashed var(--accent);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;background:var(--accent-soft);font-size:13.5px;line-height:1.6;user-select:text}
.imgslot svg{grid-row:span 4;width:34px;height:34px;color:var(--accent)}
.imgslot .t{font-weight:800;color:var(--accent);font-size:14px}
.imgslot .k{color:var(--muted);font-size:12px}
.imgslot code{font-family:var(--f-mono);font-size:12px;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.tags span{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px}
.metadesc{margin-top:14px;font-size:13px;color:var(--muted)}
.metadesc b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:10}
.example-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s}.btn:active{transform:translateY(1px)}}
</style>

<div class="wrap">
  <header>
    <h1>블로그 원고 <em>자동완성</em></h1>
    <p>제목과 키워드만 넣으면 이미지 3장 넣을 자리까지 표시된 1,000~1,200자 블로그 원고가 바로 나와요. 메인 키워드는 7~8회로 맞춰 드려요. API 키도, 가입도 필요 없어요.</p>
  </header>

  <div class="grid">
    <form id="f" autocomplete="off">
      <div class="field">
        <label for="title">블로그 제목 <span class="hint">· 실습에서 뽑은 제목 중 하나</span></label>
        <textarea id="title" rows="2"></textarea>
        <span class="count" id="titleCount">0자</span>
      </div>
      <div class="field">
        <label for="kw">메인 키워드</label>
        <input type="text" id="kw" placeholder="예: 환절기 면역력">
      </div>
      <div class="field">
        <label for="subs">서브 키워드 <span class="hint">· 쉼표로 구분, 최대 3개가 소제목이 돼요</span></label>
        <input type="text" id="subs" placeholder="예: 수면 습관, 따뜻한 차, 비타민D">
      </div>
      <div class="field">
        <span class="lbl" id="platL">블로그 플랫폼</span>
        <div class="seg" role="radiogroup" aria-labelledby="platL">
          <input type="radio" name="plat" id="p-naver" value="naver" checked><label for="p-naver">네이버</label>
          <input type="radio" name="plat" id="p-tistory" value="tistory"><label for="p-tistory">티스토리</label>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="toneL">말투</span>
        <div class="seg" role="radiogroup" aria-labelledby="toneL">
          <input type="radio" name="tone" id="t-friend" value="friend" checked><label for="t-friend">친근하게</label>
          <input type="radio" name="tone" id="t-expert" value="expert"><label for="t-expert">전문가</label>
          <input type="radio" name="tone" id="t-review" value="review"><label for="t-review">경험·후기</label>
        </div>
      </div>
      <details id="more">
        <summary>이미지 설명 · 내 경험 넣기 (선택, 넣으면 더 좋아요)</summary>
        <div class="field"><label for="img1">이미지 1 <span class="hint">· 대표(썸네일)</span></label><input type="text" id="img1" placeholder="비워두면 자동으로 추천해요"></div>
        <div class="field"><label for="img2">이미지 2</label><input type="text" id="img2"></div>
        <div class="field"><label for="img3">이미지 3</label><input type="text" id="img3"></div>
        <div class="field"><label for="exp">내 경험 한두 줄 <span class="hint">· 본문에 자연스럽게 들어가요</span></label>
          <textarea id="exp" rows="2" placeholder="예: 작년 가을에 감기를 세 번이나 걸렸어요"></textarea></div>
      </details>
      <button type="submit" class="btn primary" id="go">원고 쓰기</button>
      <button type="button" class="btn" id="again">다른 버전으로 다시 쓰기</button>

      <div class="ai-box">
        <p><b>AI로 더 자연스럽게 다듬고 싶다면</b><br>아래 버튼으로 프롬프트를 복사해서 무료 AI에 붙여넣으세요.</p>
        <button type="button" class="btn sm" id="copyPrompt">AI용 프롬프트 복사</button>
        <div class="links">
          <a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT 열기</a>
          <a href="https://gemini.google.com" target="_blank" rel="noopener">Gemini 열기</a>
          <a href="https://claude.ai" target="_blank" rel="noopener">Claude 열기</a>
        </div>
        <button type="button" class="btn sm primary" id="aiWrite" hidden>Claude로 바로 다시 쓰기</button>
        <button type="button" class="btn sm" id="aiStop" hidden>멈추기</button>
      </div>
    </form>

    <section class="out" aria-live="polite">
      <div class="toolbar">
        <button type="button" class="btn sm primary" id="copyMain">네이버용 복사</button>
        <button type="button" class="btn sm" id="copyAlt">HTML 복사</button>
        <button type="button" class="btn sm" id="toggleHl" aria-pressed="true">키워드 형광펜 끄기</button>
        <span class="spacer"></span>
        <span class="status" id="status"></span>
      </div>
      <div class="checks">
        <h2>상위노출 체크</h2>
        <div class="chips" id="chips"></div>
      </div>
      <article id="post" contenteditable="true" spellcheck="false" aria-label="완성된 블로그 원고 (클릭해서 직접 고칠 수 있어요)">
        <h2 class="post-title" id="postTitle"></h2>
        <p class="post-meta" id="postMeta"></p>
        <div class="post-body" id="postBody"></div>
        <div class="tags" id="tags"></div>
        <p class="metadesc" id="metaDesc" hidden></p>
      </article>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const IMG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>';

/* ---------- 한국어 조사 ---------- */
function hasBatchim(w, ro){
  const ch = (w||'').trim().slice(-1); if(!ch) return false;
  const c = ch.charCodeAt(0);
  if(c>=0xAC00 && c<=0xD7A3){ const j=(c-0xAC00)%28; return ro ? (j!==0 && j!==8) : j!==0; }
  if(/[0-9]/.test(ch)) return ro ? '036'.includes(ch) : '013678'.includes(ch);
  if(/[a-z]/i.test(ch)) return /[lmn]/i.test(ch) && !ro;
  return false;
}
function J(w, pair){
  const [a,b] = pair.split('/');
  return w + (hasBatchim(w, pair==='으로/로') ? a : b);
}
const E = w => J(w,'이에요/예요');

/* ---------- 랜덤 ---------- */
let seed = 1;
function rng(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
const pick = a => a[Math.floor(rng()*a.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- 입력 ---------- */
function readInput(){
  const val = n => document.querySelector(`input[name=${n}]:checked`).value;
  const title = $('title').value.trim();
  let kw = $('kw').value.trim();
  if(!kw && title) kw = title.split(/[,\s]+/).slice(0,2).join(' ');
  const subs = $('subs').value.split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean).slice(0,3);
  let exp = $('exp').value.trim();
  if(exp && !/[.!?요다)~]$/.test(exp)) exp += '.';
  return { title, k:kw, subs, plat:val('plat'), tone:val('tone'),
           imgs:[$('img1').value.trim(),$('img2').value.trim(),$('img3').value.trim()], exp };
}
function typeOf(t){
  if(/후기|내돈내산|사용기|써보|먹어보|가보|해보|솔직|리뷰|경험/.test(t)) return 'review';
  if(/추천|BEST|베스트|TOP|순위|종류|비교|고르는/i.test(t)) return 'recommend';
  if(/방법|하는\s?법|꿀팁|팁|요령|노하우|따라|단계|루틴/.test(t)) return 'howto';
  return 'info';
}

/* ---------- 원고 생성 (템플릿 엔진) ----------
   목표: 본문 공백 제외 1,000~1,200자, 메인 키워드 7~8회.
   〔조사|대체어〕 = 키워드를 넣을 수도, 대체어로 바꿀 수도 있는 자리
   ~ 로 시작하는 줄 = 분량이 넘치면 빼는 문장 */
const LEN_MIN = 1000, LEN_MAX = 1200, KW_MIN = 7, KW_MAX = 8;
const DEFAULT_POINTS = {
  info:['기본 개념','핵심 장점','생활 속 활용법'],
  howto:['준비 단계','실천 방법','꾸준히 이어가는 요령'],
  recommend:['선택 기준','상황별 추천','가성비 체크 포인트'],
  review:['처음 선택한 이유','직접 해보니 좋았던 점','아쉬웠던 점']
};
const o = (josa, alt) => `〔${josa}|${alt}〕`;   // 선택형 키워드 자리

function draft(c){
  const k = c.k, ex = c.tone==='expert', rv = c.tone==='review', tp = rv ? 'review' : typeOf(c.title);
  const T = (f,e) => ex ? e : f;
  const P = [...c.subs]; for(const d of DEFAULT_POINTS[tp]) if(P.length<3) P.push(d);
  const L = [];

  /* 도입 (키워드 필수 1회) */
  L.push(pick(ex ? [
    `${J(k,'은/는')} 많은 분들이 관심을 갖는 주제지만, 정확하게 알고 계신 분은 생각보다 많지 않습니다.`,
    `${k}, 검색하면 정보는 넘쳐나는데 무엇이 맞는지 판단하기는 어렵습니다.`
  ] : rv ? [
    `${k}, 저도 처음엔 반신반의했어요. 그런데 직접 겪어보니 생각이 많이 달라졌어요.`,
    `오늘은 제가 직접 경험한 ${k} 이야기를 솔직하게 풀어보려고 해요.`
  ] : [
    `요즘 ${k} 찾아보시는 분들 정말 많으시죠? 저도 처음엔 어디서부터 알아봐야 할지 막막했어요.`,
    `혹시 ${k} 때문에 고민하고 계신가요? 검색하면 정보는 많은데 깔끔하게 정리된 글은 찾기 어렵더라고요.`
  ]));
  if(c.exp) L.push(T(`제 경우에도 ${c.exp} 그래서 더 꼼꼼하게 알아보게 됐어요.`, `실제로 저 역시 ${c.exp} 이를 계기로 관련 내용을 정리하게 되었습니다.`));
  L.push(T(`그래서 오늘은 꼭 알아야 할 내용만 골라 정리해 봤어요. 끝까지 읽어보시면 고민이 훨씬 가벼워지실 거예요.`,
           `이 글에서는 핵심 내용을 ${P.join(', ')} 순서로 정리했습니다. 필요한 부분만 골라 보셔도 충분합니다.`));
  L.push('~'+T(`기본 개념부터 실천 방법, 주의할 점까지 이 글 하나로 정리하실 수 있게 준비했어요.`, `기본 개념부터 실천 방법, 주의사항까지 순서대로 확인하실 수 있습니다.`));
  L.push('[[IMG1]]');

  /* 섹션 1 (제목 키워드 필수) */
  L.push('## '+{info:`${k}, 왜 관심이 많을까?`, howto:`${k}, 시작 전에 알아둘 것`, recommend:`${k} 고르기 전 체크할 점`, review:`${J(k,'을/를')} 선택하게 된 계기`}[tp]);
  L.push(T(`${o('이/가','이 주제가')} 꾸준히 검색되는 이유는 단순해요. 일상에서 바로 체감할 수 있고, 조금만 알아두면 시간과 비용을 아낄 수 있기 때문이에요.`,

/* 키워드 자리 확정: 필수 + 선택 자리 일부를 키워드로 → 7~8회 */
function resolveKw(lines, k){
  const text = lines.join('\n');
  const fixed = text.replace(/〔[^〕]*〕/g,'').split(k).length - 1;
  const slots = (text.match(/〔[^〕]*〕/g)||[]).length;
  const want = Math.max(0, Math.min(slots, KW_MAX - fixed));
  // 선택 자리를 고르게 분산해서 사용
  const use = new Set(); for(let i=0;i<want;i++) use.add(Math.floor((i+0.5)*slots/want));
  let idx = 0;
  return lines.map(l => l.replace(/〔([^|〕]*)\|([^〕]*)〕/g, (_,josa,alt)=>{
    const on = use.has(idx++);
    if(!on) return alt;
    if(!josa) return k;
    if(josa==='에서'||josa==='에 대해') return k+josa;
    if(josa.includes('/')) return J(k,josa);
    return `${k} ${josa}`;                      // '주의사항, ...' 같은 소제목
  }));
}
const bodyLen = lines => lines.filter(l=>!/^\[\[IMG/.test(l) && !/^태그/.test(l))
  .map(l=>l.replace(/^~/,'').replace(/^(###?|-)\s+/,'')).join('').replace(/\s/g,'').length;

function generate(c){
  const { lines, tp } = draft(c);
  // 1) 분량: 넘치면 ~ 줄을 뒤에서부터 빼기
  let cur = lines.slice();
  const lenNow = () => bodyLen(resolveKw(cur, c.k));
  for(let i=cur.length-1; i>=0 && lenNow()>LEN_MAX-20; i--){
    if(cur[i].startsWith('~')){ const t=cur.slice(); t.splice(i,1); cur=t; }
  }
  cur = cur.map(l=>l.replace(/^~/,''));
  // 2) 키워드 7~8회 확정
  const out = resolveKw(cur, c.k);
  // 3) 태그
  const nos = s => s.replace(/\s+/g,'');
  const tags = [...new Set([k0(c.k), nos(c.k), ...c.subs, nos(c.k)+'추천', nos(c.k)+'방법', nos(c.k)+'정보', nos(c.k)+'꿀팁', nos(c.k)+(tp==='review'?'후기':'총정리'), nos(c.k)+'주의사항', nos(c.k)+'효과'].map(nos))]
    .slice(0, c.plat==='naver'?10:8);
  out.push('태그: '+tags.map(t=>'#'+t).join(' '));
  return out.join('\n');
}
const k0 = s => s;

/* ---------- 이미지 칸 ---------- */
function imgInfo(c, n, h2text){
  const nos = c.k.replace(/\s+/g,'-');
  const auto = [
    `${c.k} 대표 썸네일 — 제목 핵심 문구를 크게 넣으면 클릭률이 올라가요`,
    `${h2text || c.k+' 핵심 내용'}을 보여주는 설명 이미지`,
    `${c.k} 핵심 요약 체크리스트 이미지`
  ];
  const where = ['도입부 바로 아래 · 대표 이미지(썸네일)로 설정','본문 중간 · 핵심 내용 사이','마무리 바로 위 · 요약 정리용'];
  const desc = c.imgs[n-1] || auto[n-1];
  return { where:where[n-1], desc, file:`${nos}-${n}.jpg`, alt:`${c.k} ${(c.imgs[n-1]||['대표 이미지','설명 이미지','요약 정리'][n-1])}`.slice(0,60) };
}

/* ---------- 렌더 ---------- */
const esc = s => s.replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function hl(s, k){
  const t = esc(s); if(!k) return t;
  const kk = esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp(kk,'g'), m=>`<mark class="kw">${m}</mark>`);
}
let last = { c:null, tags:[] };
function render(text, c){
  const body = $('postBody'); let html = '', list = false, h2s = [], tags = [];
  const lines = text.split('\n');
  lines.forEach(l=>{ const m=l.match(/^##\s+(.+)/); if(m && !l.startsWith('###')) h2s.push(m[1].trim()); });
  const closeList = () => { if(list){ html+='</ul>'; list=false; } };
  for(let raw of lines){
    const l = raw.trim(); if(!l) { closeList(); continue; }
    let m;
    if((m = l.match(/^\[\[\s*IMG\s*([123])\s*\]\]$/i)) || (m = l.match(/^\[이미지\s*([123])[^\]]*\]$/))){
      closeList(); const n=+m[1]; const info = imgInfo(c, n, h2s[1]);
      html += `<div class="imgslot" contenteditable="false" data-n="${n}" data-desc="${esc(info.desc)}" data-file="${esc(info.file)}" data-alt="${esc(info.alt)}">${IMG_ICON}
        <span class="t">이미지 ${n} 넣는 자리</span><span class="k">${esc(info.where)}</span>
        <span>${esc(info.desc)}</span>
        <span class="k">파일명 <code>${esc(info.file)}</code> · 대체텍스트 <code>${esc(info.alt)}</code></span></div>`;
    } else if(m = l.match(/^(태그|해시태그)\s*[:：]\s*(.+)/)){
      closeList(); tags = (m[2].match(/#?[^\s#,]+/g)||[]).map(t=>t.replace(/^#/,'')).filter(Boolean);
    } else if(m = l.match(/^###\s+(.+)/)){ closeList(); html += `<h3>${hl(m[1],c.k)}</h3>`; }
    else if(m = l.match(/^##\s+(.+)/)){ closeList(); html += `<h2>${hl(m[1],c.k)}</h2>`; }
    else if(m = l.match(/^[-•*]\s+(.+)/)){ if(!list){ html+='<ul>'; list=true; } html += `<li>${hl(m[1].replace(/\*\*/g,''),c.k)}</li>`; }
    else if(/^#\s/.test(l)) { closeList(); }
    else { closeList(); html += `<p>${hl(l.replace(/\*\*/g,''),c.k)}</p>`; }
  }
  closeList();
  body.innerHTML = html;
  $('postTitle').textContent = c.title || '(제목을 입력하세요)';
  $('tags').innerHTML = tags.map(t=>`<span>#${esc(t)}</span>`).join('');
  $('postMeta').textContent = c.plat==='naver' ? '네이버 블로그용 원고 · 클릭해서 직접 고칠 수 있어요' : '티스토리용 원고 · 클릭해서 직접 고칠 수 있어요';
  const md = $('metaDesc');
  if(c.plat==='tistory'){
    const firstP = body.querySelector('p')?.textContent || '';
    const d = (`${c.title}. ${firstP}`).slice(0,150);
    md.innerHTML = `<b>메타 설명(검색 결과 요약문):</b> ${esc(d)}`; md.hidden=false;
  } else md.hidden = true;
  last = { c, tags };
  $('copyMain').textContent = c.plat==='naver' ? '네이버용 복사' : '티스토리용 복사';
  checks();
}

/* ---------- SEO 체크 ---------- */
function checks(){
  const c = last.c; if(!c) return;
  const clone = $('postBody').cloneNode(true); clone.querySelectorAll('.imgslot').forEach(n=>n.remove());
  document.body.appendChild(clone); clone.style.cssText='position:absolute;left:-9999px;width:600px';
  const text = clone.innerText; clone.remove();
  const chars = text.replace(/\s/g,'').length;
  const kc = c.k ? (text.split(c.k).length-1) : 0;
  const firstP = $('postBody').querySelector('p')?.textContent || '';
  const tlen = c.title.length;
  const imgs = $('postBody').querySelectorAll('.imgslot').length;
  const h2 = $('postBody').querySelectorAll('h2').length;
  const items = [
    [tlen>=15 && tlen<=40, `제목 <b>${tlen}</b>자`, tlen<15?'조금 짧아요':tlen>40?'조금 길어요':'적당해요'],
    [c.k && c.title.includes(c.k) && c.title.indexOf(c.k)<=12, '제목 앞쪽에 키워드', c.k && c.title.includes(c.k) ? (c.title.indexOf(c.k)<=12?'좋아요':'앞으로 옮겨보세요') : '제목에 넣어주세요'],
    [c.k && firstP.includes(c.k), '첫 문단에 키워드', ''],
    [kc>=KW_MIN && kc<=KW_MAX, `본문 키워드 <b>${kc}</b>회`, kc<KW_MIN?'7~8회 권장':kc>KW_MAX?'많아요 · 어뷰징 주의':'적당해요'],
    [chars>=LEN_MIN && chars<=LEN_MAX, `본문 <b>${chars.toLocaleString()}</b>자`, chars<LEN_MIN?'1,000자 이상 권장':chars>LEN_MAX?'1,200자 이하 권장':'공백 제외 · 적당해요'],
    [h2>=3, `소제목 <b>${h2}</b>개`, ''],
    [imgs===3, `이미지 자리 <b>${imgs}</b>곳`, '']
  ];
  $('chips').innerHTML = items.map(([ok,l,s])=>`<span class="chip ${ok?'ok':'warn'}">${l}${s?' · '+s:''}</span>`).join('');
}

/* ---------- 복사 ---------- */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
function exportPlain(){
  const out = [last.c.title, ''];
  $('postBody').childNodes.forEach(n=>{
    if(n.nodeType!==1) return;
    if(n.classList.contains('imgslot')) out.push(`[이미지 ${n.dataset.n} 넣기: ${n.dataset.desc}]`, '');
    else if(n.tagName==='UL') { n.querySelectorAll('li').forEach(li=>out.push('· '+li.innerText.trim())); out.push(''); }
    else if(n.tagName==='H2') out.push('■ '+n.innerText.trim(), '');
    else if(n.tagName==='H3') out.push(n.innerText.trim());
    else out.push(n.innerText.trim(), '');
  });
  const tg = [...$('tags').querySelectorAll('span')].map(s=>s.textContent).join(' ');
  if(tg) out.push('', tg);
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function exportHTML(){
  const clone = $('postBody').cloneNode(true);
  clone.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  clone.querySelectorAll('.imgslot').forEach(s=>{
    const p=document.createElement('p'); p.textContent=`[이미지 ${s.dataset.n} 넣기: ${s.dataset.desc} / 파일명 ${s.dataset.file} / 대체텍스트 ${s.dataset.alt}]`;
    s.replaceWith(document.createComment(` 이미지 ${s.dataset.n} `), p);
  });
  let h = clone.innerHTML.replace(/<\/(p|h2|h3|ul|li)>/g,'</$1>\n');
  const tg = [...$('tags').querySelectorAll('span')].map(s=>s.textContent).join(' ');
  return h + (tg ? `\n<p>${esc(tg)}</p>` : '');
}
async function copyText(text, html, msg){
  try{
    if(html && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);
    } else await navigator.clipboard.writeText(text);
    toast(msg);
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast(msg); return; }catch(_){}
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove(); toast(ok?msg:'복사가 막혀 있어요. 원고를 길게 눌러 직접 복사해 주세요.');
  }
}

/* ---------- AI 프롬프트 ---------- */
function buildPrompt(c, forClaude){
  const plat = c.plat==='naver' ? '네이버 블로그' : '티스토리(구글 검색)';
  const tone = {friend:'친근한 해요체', expert:'신뢰감 있는 전문가 합니다체', review:'직접 경험한 듯한 솔직한 후기체(해요체)'}[c.tone];
  const imgMark = n => forClaude ? `[[IMG${n}]]` : `[이미지 ${n}]`;
  const imgs = [1,2,3].map(n=>`${n}) ${imgInfo(c,n,'').desc}`).join('\n');
  return `너는 조회수 높은 ${plat} 글을 쓰는 전문 블로거야. 아래 조건으로 블로그 본문을 써줘.

제목: ${c.title}
메인 키워드: ${c.k}
서브 키워드: ${c.subs.join(', ') || '(없음 — 주제에 맞게 3개 정해서 써줘)'}
말투: ${tone}
분량: 본문 공백 제외 1,000~1,200자 (이 범위를 꼭 지킬 것)
${c.exp ? '글쓴이 경험(자연스럽게 녹여줘): '+c.exp+'\n' : ''}이미지 3장 내용:
${imgs}

규칙:
- 첫 문장에 메인 키워드를 넣고 독자가 공감할 질문이나 고민으로 시작
- 메인 키워드는 소제목 포함 본문 전체에 정확히 7~8회만 자연스럽게 사용 (9회 이상은 어뷰징 위험이므로 금지)
- 소제목은 '## '로 시작하고 3~5개, 세부 항목은 '### '
- 이미지 위치는 단독 줄로 ${imgMark(1)}, ${imgMark(2)}, ${imgMark(3)} 표시: 1은 도입부 바로 아래, 2는 본문 중간, 3은 마무리 바로 위
- 목록은 '- '로 시작
- 문단은 2~3문장으로 짧게, 모바일에서 읽기 편하게
- ${c.plat==='naver' ? '마지막은 공감·댓글·이웃추가를 부드럽게 유도' : '"자주 묻는 질문" 소제목을 짧게 넣고, 마지막은 구독·댓글 유도'}
- 확인되지 않은 수치, 과장된 효과, 의학적 단정 표현은 쓰지 말 것
- 제목은 다시 쓰지 말고 본문만 출력, 마크다운 굵게(**)는 쓰지 말 것
- 맨 마지막 줄에 '태그: ' 뒤에 해시태그 ${c.plat==='naver'?10:8}개`;
}

/* ---------- 실행 ---------- */
function run(newSeed){
  const c = readInput();
  if(!c.title){ toast('블로그 제목을 먼저 넣어주세요'); $('title').focus(); return; }
  if(newSeed) seed = (Date.now() ^ Math.floor(Math.random()*1e9));
  else seed = [...(c.title+c.k)].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0, 7);
  render(generate(c), c);
  $('status').textContent = '원고 완성 · 템플릿 버전';
  save();
}
$('f').addEventListener('submit', e=>{ e.preventDefault(); run(false); });
$('again').addEventListener('click', ()=>run(true));
$('title').addEventListener('input', ()=>{ $('titleCount').textContent = $('title').value.trim().length+'자'; });
$('copyMain').addEventListener('click', ()=>{
  if(!last.c) return;
  if(last.c.plat==='naver') copyText(exportPlain(), null, '복사했어요. 네이버 글쓰기에 붙여넣고 [이미지] 자리에 사진을 넣으세요.');
  else copyText(exportPlain(), exportHTML(), '복사했어요. 티스토리 기본모드에 붙여넣으세요.');
});
$('copyAlt').addEventListener('click', ()=>{ if(last.c) copyText(exportHTML(), null, 'HTML을 복사했어요. HTML 모드에 붙여넣으세요.'); });
$('copyPrompt').addEventListener('click', ()=>{
  const c = readInput(); if(!c.title){ toast('블로그 제목을 먼저 넣어주세요'); return; }
  copyText(buildPrompt(c,false), null, '프롬프트를 복사했어요. AI 채팅창에 붙여넣으세요.');
});
$('toggleHl').addEventListener('click', e=>{
  const on = $('post').classList.toggle('hide-hl');
  e.currentTarget.textContent = on ? '키워드 형광펜 켜기' : '키워드 형광펜 끄기';
  e.currentTarget.setAttribute('aria-pressed', String(!on));
});
let ct; $('postBody').addEventListener('input', ()=>{ clearTimeout(ct); ct=setTimeout(checks,400); });

/* ---------- 저장 (이 브라우저에만) ---------- */
const IDS = ['title','kw','subs','img1','img2','img3','exp'];
function save(){ try{ const o={}; IDS.forEach(i=>o[i]=$(i).value); ['plat','tone'].forEach(n=>o[n]=document.querySelector(`input[name=${n}]:checked`).value); localStorage.setItem('bw-draft', JSON.stringify(o)); }catch(e){} }
function load(){
  let o=null; try{ o=JSON.parse(localStorage.getItem('bw-draft')||'null'); }catch(e){}
  if(!o){
    o = { title:'환절기 면역력 높이는 방법, 매일 5분이면 충분해요', kw:'환절기 면역력', subs:'수면 습관, 따뜻한 차, 비타민D', plat:'naver', tone:'friend' };
    $('status').innerHTML = '예시 원고예요<span class="example-tag">예시</span>';
  }
  IDS.forEach(i=>{ if(o[i]!=null) $(i).value=o[i]; });
  ['plat','tone'].forEach(n=>{ const el=document.querySelector(`input[name=${n}][value="${o[n]}"]`); if(el) el.checked=true; });
  $('titleCount').textContent = $('title').value.trim().length+'자';
  const keep = $('status').innerHTML;
  run(false);
  if(keep) $('status').innerHTML = keep;
}
load();

/* ---------- Claude로 바로 쓰기 (claude.ai에서 열었을 때만) ---------- */
(async ()=>{
  if(!window.claude?.use) return;
  let sample = null;
  try{ sample = await window.claude.use('sample'); }catch(e){}
  if(!sample) return;
  const btn=$('aiWrite'), stop=$('aiStop'); btn.hidden=false;
  let ctl=null;
  stop.addEventListener('click', ()=>ctl?.abort());
  btn.addEventListener('click', async ()=>{
    const c = readInput(); if(!c.title){ toast('블로그 제목을 먼저 넣어주세요'); return; }
    ctl = new AbortController(); btn.disabled=true; stop.hidden=false;
    $('status').textContent = 'Claude가 원고를 쓰는 중이에요 (30초~1분)';
    try{
      const { text, truncated } = await sample(buildPrompt(c,true), { signal:ctl.signal, cache:false, onText:({text})=>render(text,c) });
      render(text, c); save();
      $('status').textContent = truncated ? 'Claude 원고 · 길이 제한으로 끝이 잘렸어요' : '원고 완성 · Claude 버전';
    }catch(e){
      if(e.text) render(e.text, c);
      const msg = {cancelled:'멈췄어요', not_granted:'Claude 사용을 허용하지 않아 템플릿 버전을 이용해 주세요', sampling_disabled:'이 계정에서는 Claude를 쓸 수 없어요', rate_limited:'사용량이 많아요. 잠시 뒤 다시 눌러주세요', refused:'이 주제는 Claude가 쓰기 어려워요. 제목을 바꿔보세요'}[e.code] || '연결이 끊겼어요. 다시 눌러주세요';
      $('status').textContent = msg;
      if(['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e.code)) btn.hidden=true;
    }finally{ btn.disabled=false; stop.hidden=true; }
  });
})();
})();
</script>
